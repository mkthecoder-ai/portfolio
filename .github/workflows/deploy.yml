name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  SWA_TOKEN_SET: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}

jobs:
  deploy:
    name: deploy
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - if: env.SWA_TOKEN_SET != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set yet; skipping deploy (see infra/README.md)."
      - if: env.SWA_TOKEN_SET == 'true'
        uses: actions/checkout@v7
      - if: env.SWA_TOKEN_SET == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.SWA_TOKEN_SET == 'true'
        run: npm ci && npm run build && npm run check:content
      - name: Launch readiness (production only)
        if: env.SWA_TOKEN_SET == 'true' && github.event_name != 'pull_request'
        run: npm run check:launch
      - if: env.SWA_TOKEN_SET == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/out
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close-preview:
    name: close preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - if: env.SWA_TOKEN_SET == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
